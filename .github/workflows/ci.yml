name: Tests and coverage checks
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test,dev,solver]'
      - name: Tests, including optional CP-SAT backend
        run: python -m pytest -q
      - name: Benchmark formatting
        run: python -m ruff format --check experiments/benchmark_coverage.py
      - name: Static and whitespace checks for coverage code
        run: >-
          python -m ruff check
          src/roulette/coverage.py
          src/roulette/coverage_search.py
          src/roulette/coverage_optimisation.py
          src/roulette/coverage_cpsat.py
          src/roulette/coverage_risk.py
          experiments/coverage.py
          experiments/optimise_coverage.py
          experiments/benchmark_coverage.py
          experiments/coverage_frontier.py
          tests/test_coverage.py
          tests/test_coverage_search.py
          tests/test_coverage_optimisation.py
          tests/test_coverage_risk.py
          tests/test_optimise_coverage_cli.py
          tests/test_benchmark_coverage.py
          tests/test_coverage_frontier_cli.py
