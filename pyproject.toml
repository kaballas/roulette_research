[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roulette-research"
version = "0.1.0"
description = "Reproducible roulette probability and finite-bankroll research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.12"]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["ruff>=0.11"]
solver = ["ortools>=9.10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness plus whitespace formatting; scoped paths are explicit in CI.
select = ["E9", "F", "W291", "W292", "W293"]
